[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roborigor"
version = "0.0.2.dev0"
description = "Statistical rigor toolkit for robot policy evaluation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nihal Gunukula" }]
keywords = ["robotics", "evaluation", "statistics", "VLA", "LIBERO", "benchmarking"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

# core stays 3.8-compatible: it is imported inside the LIBERO client process,
# which is pinned to Python 3.8. Stats/analysis modules may require 3.11+.
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.20",
]

[project.urls]
Repository = "https://github.com/nihalgunu/roborigor"

[project.optional-dependencies]
stats = [
    "scipy>=1.9",
]
plots = [
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
roborigor = "roborigor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
